name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'main-src/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
