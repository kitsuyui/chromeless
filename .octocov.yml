# https://github.com/k1LoW/octocov?tab=readme-ov-file#configuration
coverage:
  acceptable: 40%
  paths:
    - coverage/lcov.info
    - coverage/clover.xml
codeToTestRatio:
  code:
    - 'src/**/*.ts'
    - 'src/**/*.tsx'
    - 'main-src/**/*.ts'
  test:
    - 'src/**/*.test.ts'
    - 'src/**/*.test.tsx'
    - 'main-src/**/*.test.ts'
testExecutionTime:
  if: true
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  updatePrevious: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
